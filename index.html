<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudioTraino</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="StudioTraino">
<meta name="application-name" content="StudioTraino">
<meta name="theme-color" content="#0b0b0d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-64.png">
<style>
/* Layout: one-column phone app in the iOS idiom. Large titles that hand off to a translucent nav bar on scroll,
   inset-grouped cards, a floating rest-timer pill and a translucent tab bar that content scrolls under.
   Motion: press feedback on every control, drawer curve for sheets, enter/exit along the same path. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --fill:rgba(118,118,128,.12); --fill-strong:rgba(118,118,128,.2);
  --fg:#000000; --muted:#6c6c72; --sep:rgba(60,60,67,.18);
  --accent:#ff9500; --accent-ink:#1f1200; --accent-text:#a04c00; --accent-soft:rgba(255,149,0,.14);
  --done:#34c759; --done-text:#1f7a35; --done-soft:rgba(52,199,89,.14); --done-fill:#248a3d; --done-ink:#ffffff;
  --danger:#ff3b30; --danger-text:#d70015;
  --mat:rgba(246,246,248,.78); --mat-edge:rgba(0,0,0,.12);
  --seg-on:#ffffff; --pill:rgba(30,30,32,.9); --pill-fg:#ffffff; --scrim:rgba(0,0,0,.32); --fig:#3a3a3c;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.36);
  --fg:#ffffff; --muted:#98989f; --sep:rgba(84,84,88,.6);
  --accent:#ff9f0a; --accent-ink:#1f1200; --accent-text:#ffb340; --accent-soft:rgba(255,159,10,.18);
  --done:#30d158; --done-text:#30d158; --done-soft:rgba(48,209,88,.16); --done-fill:#30d158; --done-ink:#00210b;
  --danger:#ff453a; --danger-text:#ff6961;
  --mat:rgba(22,22,24,.74); --mat-edge:rgba(255,255,255,.1);
  --seg-on:#636366; --pill:rgba(58,58,60,.92); --pill-fg:#ffffff; --scrim:rgba(0,0,0,.55); --fig:#d1d1d6;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.36);
  --fg:#ffffff; --muted:#98989f; --sep:rgba(84,84,88,.6);
  --accent:#ff9f0a; --accent-ink:#1f1200; --accent-text:#ffb340; --accent-soft:rgba(255,159,10,.18);
  --done:#30d158; --done-text:#30d158; --done-soft:rgba(48,209,88,.16); --done-fill:#30d158; --done-ink:#00210b;
  --danger:#ff453a; --danger-text:#ff6961;
  --mat:rgba(22,22,24,.74); --mat-edge:rgba(255,255,255,.1);
  --seg-on:#636366; --pill:rgba(58,58,60,.92); --pill-fg:#ffffff; --scrim:rgba(0,0,0,.55); --fig:#d1d1d6;
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-ui);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(170px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* press feedback: on pointer-down, instant */
.press,button.btn,.check,.step button,.tabs button,.iconbtn{transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease,border-color 160ms ease}
.press:active,button.btn:not(:disabled):active,.check:active,.iconbtn:not(:disabled):active{transform:scale(.97)}
.step button:active{transform:scale(.9);background:var(--fill-strong)}

/* nav bar: transparent at rest, material once content scrolls under */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.top::before{content:"";position:absolute;inset:0;background:var(--mat);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 .5px 0 var(--mat-edge);opacity:0;transition:opacity 200ms ease}
.top.scrolled::before{opacity:1}
.top .in{position:relative;max-width:560px;margin:0 auto;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand b{color:var(--accent-text);font-weight:700}
.brand{display:flex;align-items:center;gap:7px}.brand img{width:22px;height:22px;border-radius:6px;flex:none}
.navtitle{font-size:17px;font-weight:600;max-width:calc(100vw - 210px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity 200ms ease,transform 200ms var(--ease-out)}
.top.scrolled .navtitle{opacity:1;transform:none}
.brand{transition:opacity 200ms ease}
.top.scrolled .brand{opacity:0}
.sync{justify-self:end;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;transition:background-color 200ms ease}
.sync[data-s="synced"] i{background:var(--done)}
.sync[data-s="offline"] i{background:var(--danger)}
.sync[data-s="connecting"] i{background:var(--accent)}
@media (max-width:380px){.sync:not(.login) span{display:none}}
.sync .gear{position:relative;display:flex;width:24px;height:24px;color:var(--fg);opacity:.78}
.sync .gear svg{width:24px;height:24px;display:block}
.sync .gear i{position:absolute;right:-2px;top:-1px;box-shadow:0 0 0 2px var(--bg)}
button.sync.login .gear{display:none}

/* type */
h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:6px 0 2px;text-wrap:balance}
h2{font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;letter-spacing:-.005em}
.section{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 4px 8px;font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}

.card{background:var(--surface);border-radius:var(--r);padding:16px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:600;font-size:17px;background:var(--fill);overflow:hidden}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.tinted{background:var(--accent-soft);color:var(--accent-text)}
.btn.plain{background:transparent;color:var(--accent-text)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px;border-radius:999px}
.btn:disabled{opacity:.4}

/* hold-to-confirm: slow while deciding, snappy on release */
.hold{background:var(--fill);color:var(--danger-text)}
.hold .fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--danger);color:#fff;
  clip-path:inset(0 100% 0 0);transition:clip-path 200ms var(--ease-out)}
.hold.holding .fill{clip-path:inset(0 0 0 0);transition:clip-path 900ms linear}

/* workouts */
.wk{display:flex;flex-direction:column;gap:14px}
.wk .meta{display:flex;gap:4px 12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:4px}
.wk .meta .chip{margin:0;padding:1px 8px;font-size:12px;font-weight:600;line-height:18px}
.wk .ex{color:var(--muted);font-size:14px;margin:0;line-height:1.4;overflow-wrap:anywhere}
.wk .actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.live{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;margin-top:8px}
.live .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .s{font-size:14px;opacity:.75}
.live .btn{background:var(--accent-ink);color:var(--accent);min-height:38px}
.empty p{margin:6px 0 16px;color:var(--muted);font-size:15px;line-height:1.45}

/* editor: inset grouped */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.group .cell{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:50px;position:relative}
.group .cell+.cell::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.cell input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:14px 0;outline:none}
.cell .k{color:var(--muted);font-size:15px;width:auto;white-space:nowrap}
.exnum{font-family:var(--f-num);font-weight:700;color:var(--accent-text);font-size:17px;width:20px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px 12px 12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;font-weight:500}
.fields input{width:100%;min-width:0;height:44px;border-radius:10px;border:0;background:var(--fill);text-align:center;font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;transition:box-shadow 160ms ease}
.fields input:focus,.namein:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.namein{width:100%;height:50px;border:0;border-radius:12px;background:var(--surface);padding:0 16px;font-size:17px;outline:none}
.acct .namein{background:var(--fill);margin-bottom:8px}
.acct .msg{font-size:14px;color:var(--muted);min-height:20px;margin:4px 0 10px}
.acct .msg.err{color:var(--danger-text)}
button.sync{background:none;border:0;padding:0 2px;min-height:44px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
button.sync.login{font-size:15px;font-weight:600;color:var(--accent-text)}
button.sync.login i{display:none}
button.sync .person{width:20px;height:20px;display:none}
button.sync.login .person{display:block}
.exfoot{display:flex;align-items:center;gap:6px;padding:0 12px 12px}
.iconbtn{width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--fill);color:var(--fg)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.3}
.linkbtn{color:var(--danger-text);font-size:15px;font-weight:500;padding:8px 6px;border-radius:8px}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;display:grid;grid-template-columns:1fr 2fr;gap:8px;padding-block:12px}
.savebar .btn:not(.primary){background:var(--mat);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--mat-edge)}

/* active workout */
.livehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px;margin-top:6px}
.livehead .sub{margin-top:2px}
.livehead h1{margin:2px 0 0}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent-text);letter-spacing:0}
.clock{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--fill);border-radius:999px;overflow:hidden;margin:14px 0 2px}
.progress i{display:block;height:100%;width:100%;background:var(--accent);border-radius:999px;transform-origin:left center;transition:transform 300ms var(--ease-out)}
.exlive{padding:16px 12px 12px;scroll-margin-top:calc(64px + env(safe-area-inset-top,0px));transition:box-shadow 240ms ease}
.exlive.complete{box-shadow:inset 0 0 0 2px var(--done)}
.exlive{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}
.exlive h2,.wk h2,.hist .t{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.exlive .ttl{display:flex;align-items:center;gap:12px;padding:0 2px}
.exlive .badge{flex:none;width:24px;height:24px;border-radius:50%;background:var(--done-fill);color:var(--done-ink);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:opacity 200ms ease,transform 260ms var(--ease-out)}
.exlive.complete .badge{opacity:1;transform:none}
.exlive .badge svg{width:14px;height:14px}
.exlive .plan{color:var(--muted);font-size:14px;margin:3px 0 0}
.exlive .last{font-size:13px;color:var(--muted);margin:10px 0 0;background:var(--fill);border-radius:10px;padding:8px 10px;line-height:1.4}
.exlive .last b{color:var(--fg);font-weight:600}
.notes{font-size:14px;color:var(--muted);margin:6px 4px 0}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sethead,.set{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 50px;gap:6px;align-items:center}
.sethead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
.sethead span{text-align:center}
.set .idx{font-family:var(--f-num);font-size:17px;font-weight:700;color:var(--muted);text-align:center;transition:color 160ms ease}
.step{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border-radius:12px;background:var(--fill);height:50px;transition:background-color 200ms ease}
.step button{font-size:22px;font-weight:400;color:var(--muted);height:100%;border-radius:12px}
.step input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;outline:none}
.step input:focus{box-shadow:inset 0 0 0 2px var(--accent);border-radius:8px}
.check{height:50px;border-radius:12px;background:var(--fill);color:var(--muted);display:flex;align-items:center;justify-content:center}
.check svg{width:24px;height:24px;display:none}
.check .n{font-family:var(--f-num);font-size:18px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.set.done .check svg{display:block}.set.done .check .n{display:none}
.step .up{position:absolute;top:4px;left:50%;width:10px;height:10px;margin-left:-5px;color:var(--accent-text);opacity:0;transform:translateY(2px);transition:opacity 160ms ease,transform 200ms var(--ease-out);pointer-events:none}
.step .up.on{opacity:1;transform:none}
@media (max-width:370px){.step{grid-template-columns:38px minmax(0,1fr) 38px}}
.prog{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:10px 2px 0}
.lastline{font-size:14px;color:var(--muted);margin:0;line-height:1.35}
.lastline b{color:var(--fg);font-weight:600}
.target{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:600;font-size:15px;transition:transform 160ms var(--ease-out),background-color 160ms ease}
.target:active{transform:scale(.96)}
.target svg{width:16px;height:16px;flex:none}
.target.hint{background:var(--fill);color:var(--fg);font-weight:500}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.delta{color:var(--accent-text);font-weight:600;white-space:nowrap;margin-left:6px}
.changes{margin:-6px 0 14px;padding:10px 12px;border-radius:12px;background:var(--fill);font-size:14px;line-height:1.5;list-style:none}
.changes li{display:flex;justify-content:space-between;gap:10px}
.changes li span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.warn{font-size:14px;color:var(--muted);margin:-4px 0 14px;line-height:1.4}
.set.done .check{background:var(--done-fill);color:var(--done-ink)}
.set.done .step{background:var(--done-soft)}
.set.done .idx{color:var(--done-text)}
.setbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:0 2px}
.setbtns .btn.sm,.exfoot .linkbtn{min-height:44px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 32px);
  padding:6px 6px 6px 16px;min-height:48px;border-radius:16px;background:var(--pill);color:var(--pill-fg);font-size:15px;
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 28px rgba(0,0,0,.24);
  transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 320ms var(--ease-out),opacity 200ms ease}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast.lift{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast:not(:has(button)){padding-right:16px}
.toast button{flex:none;min-height:36px;padding:0 12px;border-radius:12px;font-weight:600;color:var(--accent);background:rgba(255,255,255,.1)}
.toast span:only-child{padding-right:10px}
/* finish recap */
.cardio .ttl{display:flex;align-items:center;gap:12px;padding:0 2px}
.cardio .plan{color:var(--muted);font-size:14px;margin:3px 0 0}
.cardio.on .cselect{display:block;margin-top:10px}
.cselect select{width:100%;height:48px;border:0;border-radius:12px;background:var(--fill);padding:0 14px;font-size:17px;color:var(--fg);outline:none;-webkit-appearance:menulist}
.cselect select:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.ctime{font-family:var(--f-num);font-size:38px;font-weight:700;line-height:1;text-align:center;margin:16px 0 14px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color 200ms ease}
.cardio.run .ctime{color:var(--accent-text)}
.cbtns{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.cbtns .btn{min-height:48px;padding:0 8px}
.cardio.on>.plan{text-align:center;margin-top:12px}
.energy{background:var(--fill);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.energy .ek{font-size:13px;color:var(--muted)}
.ev{font-family:var(--f-num);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ev span{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.bodyin{display:inline-flex;align-items:baseline;gap:6px;margin-left:auto}
.bodyin input{width:84px;height:36px;border:0;border-radius:10px;background:var(--fill);text-align:right;padding:0 10px;font:inherit;font-size:17px;font-variant-numeric:tabular-nums;outline:none}
.bodyin input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.bodyin em{font-style:normal;color:var(--muted);font-size:15px;min-width:22px}
.recap{text-align:left}
.recap .rk{width:36px;height:36px;border-radius:50%;background:var(--done-fill);color:var(--done-ink);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.recap .rk svg{width:20px;height:20px}
.recap h2{font-size:20px}
.recap .rnote{font-size:15px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.recap .changes{margin-top:12px}
.live.draft{background:var(--surface);color:var(--fg)}
.live.draft .s{color:var(--muted);opacity:1}
.live.draft .btn{background:var(--accent-soft,var(--fill));color:var(--accent-text)}
/* large text / narrow viewports (iPhone at 200% text) */
@media (max-width:300px){
  .sethead{display:none}
  .set{grid-template-columns:minmax(0,1fr) 46px;grid-template-rows:auto auto}
  .set{grid-template-columns:minmax(0,1fr) 40px}
  .set .step{grid-column:1;grid-template-columns:28px minmax(0,1fr) 28px}

<script>
(function(){
"use strict";
/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},

let ui={view:active?"active":"workouts",draft:null,sheet:false,updatePlan:true,swapPersist:false};
{const dr=LS.get("st_draft",null);if(dr&&dr.d&&Array.isArray(dr.d.exercises)){ui.draft=dr.d;ui.draftBase=dr.base;}}

/* ---------- sync (Supabase, private per person via row level security) ---------- */
let refs=null;
function setSync(s){const el=document.getElementById("sync");el.dataset.s=s;el.classList.toggle("login",!!SB&&s==="local");

  if(refs)enqueue(()=>refs.sessCol.doc(id).delete());}
const SB=(window.ST_CONFIG&&window.ST_CONFIG.supabaseUrl&&window.supabase)?window.supabase.createClient(window.ST_CONFIG.supabaseUrl,window.ST_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let account=null;
function sbRefs(uid){
  const T="st_docs";
  const get=async k=>{const {data,error}=await SB.from(T).select("data").eq("user_id",uid).eq("key",k).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data?data.data:null}};
  const set=async(k,v)=>{const {error}=await SB.from(T).upsert({user_id:uid,key:k,data:v,updated_at:new Date().toISOString()});if(error)throw error};

    activeRef:{get:()=>get("active"),set:v=>set("active",v),delete:()=>del("active")},
    sessCol:{get:async()=>{const {data,error}=await SB.from(T).select("data").eq("user_id",uid).like("key","session:%");if(error)throw error;return {docs:(data||[]).map(x=>({data:()=>x.data}))}},
      doc:id=>({set:v=>set("session:"+id,v),delete:()=>del("session:"+id)})}};
}
function wipeLocal(){["st_plans","st_sessions","st_active","st_deleted","st_owner","st_draft"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});}
async function initSync(){
  if(!SB){setSync("local");return}
  setSync("connecting");
  try{
    const {data}=await Promise.race([SB.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("auth timeout")),8000))]);
    const ses=data&&data.session;
    if(!ses){account=null;setSync("local");return}
    account=ses.user;
    let owner=null;try{owner=localStorage.getItem("st_owner")}catch(e){}
    if(owner&&owner!==account.id){wipeLocal();location.reload();return}
    try{localStorage.setItem("st_owner",account.id)}catch(e){}
    const r=sbRefs(account.id);
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),12000));
    const [ps,as,ss]=await Promise.race([Promise.all([r.plansRef.get(),r.activeRef.get(),r.sessCol.get()]),timeout]);
    refs=r;
    const rp=ps.exists?ps.data():null;
    let changed=false;
    if(rp&&(rp.updatedAt||0)>(plans.updatedAt||0)){plans=clone(rp);LS.set("st_plans",plans);changed=true;}
    else if(plans.workouts.length){enqueue(()=>r.plansRef.set(clone(plans)));}
    const map=new Map();
    ss.docs.forEach(x=>{const s=x.data();if(s&&s.id)map.set(s.id,clone(s))});
    for(const delId of deleted){if(map.has(delId)){map.delete(delId);enqueue(()=>r.sessCol.doc(delId).delete())}}
    const toPush=sessions.filter(s=>!map.has(s.id)&&!deleted.includes(s.id));
    toPush.forEach(s=>map.set(s.id,s));
    const merged=[...map.values()].sort((a,b)=>b.startedAt-a.startedAt);
    if(merged.length!==sessions.length)changed=true;
    sessions=merged;saveSessions();
    toPush.forEach(pushSession);
    const ra=as.exists?as.data():null;
    if(ra&&ra.session){
      if(sessions.some(s=>s.id===ra.session.id)){enqueue(()=>r.activeRef.delete())}
      else if(!active){active=clone(ra.session);LS.set("st_active",active);changed=true;}
    }
    if(active)saveActive();
    setSync("synced");
    if((changed||ui.view==="workouts")&&ui.view!=="edit")render();
  }catch(e){console.warn(e);setSync("offline")}
}

/* cardio types with MET values from the Compendium of Physical Activities (approximate, moderate effort) */
const CARDIO=[["esteira","Esteira · caminhada",4.3],["inclinada","Esteira · caminhada inclinada",6],["corrida","Esteira · corrida",9],["bike","Bicicleta ergométrica",7],["eliptico","Elíptico",5],["escada","Simulador de escada",9],["remo","Remo ergômetro",7],["corda","Pular corda",11],["outro","Outro cardio",6]];
const CARDIO_BY=Object.fromEntries(CARDIO.map(c=>[c[0],{label:c[1],met:c[2]}]));
const LIFT_MET=4.5;
function cardioMs(c){return c?(c.ms||0)+(c.since?Date.now()-c.since:0):0}
function energy(totalMs,c,w){w=+w;if(!(w>0))return null;
  const cm=cardioMs(c),tot=Math.max(totalMs,cm),lm=tot-cm,met=(c&&CARDIO_BY[c.type]||CARDIO_BY.outro).met;
  const lift=LIFT_MET*w*lm/3600000,car=cm>0?met*w*cm/3600000:0,all=lift+car;
  return {lift:Math.round(lift),cardio:Math.round(car),total:Math.round(all),perMin:tot>0?Math.round(all/(tot/60000)*10)/10:0,w};}
function volume(s){let v=0,n=0;s.exercises.forEach(e=>e.sets.forEach(t=>{if(t.done){v+=t.w*t.r;n++}}));return {v,n};}

/* ---------- progression ---------- */
/* Rep range from the plan text: "8-10", "8 a 10", "12". */
function parseRange(t){t=String(t||"");const m=t.match(/(\d+)\s*(?:-|–|a|até)\s*(\d+)/);if(m){const a=+m[1],b=+m[2];return {lo:Math.min(a,b),hi:Math.max(a,b)}}
  const n=t.match(/\d+/);return n?{lo:+n[0],hi:+n[0]}:null;}
/* Load step: dumbbells usually go up 2 kg at a time, everything else 2,5 kg. */
function incFor(name){const x=findEx(name);return x&&x.equip==="Halteres"?(+settings.stepDb||2):(+settings.stepBar||2.5);}
/* "4 × 62,5 kg × 8", grouping consecutive identical sets. */
function fmtSets(sets){const g=[];sets.forEach(s=>{const l=g[g.length-1];if(l&&l.w===s.w&&l.r===s.r)l.n++;else g.push({w:s.w,r:s.r,n:1})});
  return g.map(x=>(x.n>1?x.n+" × ":"")+(x.w>0?fmtKg(x.w)+" kg × "+x.r:x.r+" reps")).join(" · ");}
/* Double progression: when every set at the top load reached the top of the rep range, go up one step;
   otherwise keep the load and chase the top of the range. */
function suggest(e){const L=e.last;if(!L||!L.sets.length)return null;const rg=parseRange(e.reps);if(!rg)return null;
  const maxW=Math.max(...L.sets.map(s=>s.w));const top=L.sets.filter(s=>s.w===maxW);
  if(maxW>0&&L.sets.length>=e.sets.length&&top.every(s=>s.r>=rg.hi))return {kind:"up",w:Math.round((maxW+incFor(e.name))*100)/100,r:rg.lo};
  return {kind:"reps",w:maxW,r:rg.hi};}
function lastSetW(e,j){const L=e.last;if(!L||!L.sets.length)return null;return L.sets[Math.min(j,L.sets.length-1)].w;}
function markUp(i,j){const e=active.exercises[i];const el=document.getElementById(`wu-${i}-${j}`);if(!el)return;const lw=lastSetW(e,j);el.classList.toggle("on",lw!=null&&e.sets[j].w>lw);}

function findEx(name){const k=norm(name);if(!k)return null;if(BYKEY.has(k))return BYKEY.get(k);

function parsePts(s){const o={};String(s||"").trim().split(/\s+/).forEach(t=>{const m=t.match(/^([A-Z]+)(-?[\d.]+),(-?[\d.]+)$/);if(m)o[m[1]]=[+m[2],+m[3]]});return o}
Object.values(PAT).forEach(p=>{p.a=parsePts(p.A);p.b=Object.assign({},p.a,parsePts(p.B))});
function figure(pid,anim){
  const p=PAT[pid];
  if(!p)return `<svg viewBox="4 -8 112 118" class="fig" aria-hidden="true"><circle cx="60" cy="50" r="22" class="fq"/><text x="60" y="58" text-anchor="middle" class="fqt">?</text></svg>`;
  anim=anim&&!reduceMotion();
  const A=p.a,B=p.b,S0=anim?A:B;
  const sp='keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2.6s" repeatCount="indefinite"';
  const av=(at,a,b)=>anim&&a!==b?`<animate attributeName="${at}" values="${a};${b};${a}" ${sp}/>`:"";
  const ln=(a,b,cls)=>`<line class="${cls}" x1="${S0[a][0]}" y1="${S0[a][1]}" x2="${S0[b][0]}" y2="${S0[b][1]}">${av("x1",A[a][0],B[a][0])}${av("y1",A[a][1],B[a][1])}${av("x2",A[b][0],B[b][0])}${av("y2",A[b][1],B[b][1])}</line>`;
  const toFixed=(x,y,pt,cls)=>`<line class="${cls}" x1="${x}" y1="${y}" x2="${S0[pt][0]}" y2="${S0[pt][1]}">${av("x2",A[pt][0],B[pt][0])}${av("y2",A[pt][1],B[pt][1])}</line>`;
  const mv=(pt,inner)=>{const a=A[pt],b=B[pt],s0=S0[pt];if(!a)return "";
    const t=anim&&(a[0]!==b[0]||a[1]!==b[1])?`<animateTransform attributeName="transform" type="translate" values="${a[0]},${a[1]};${b[0]},${b[1]};${a[0]},${a[1]}" ${sp}/>`:"";
    return `<g transform="translate(${s0[0]},${s0[1]})">${t}${inner}</g>`;};
  const list=v=>String(v||"").split(" ").filter(Boolean);
  let s=p.props||"";
  list(p.lever).forEach(c=>{const [xy,pt]=c.split(">");const [x,y]=xy.split(",");s+=toFixed(x,y,pt,"flv")});
  list(p.cable).forEach(c=>{const [pt,xy]=c.split(">");const [x,y]=xy.split(",");s+=toFixed(x,y,pt,"fc")});
  p.segs.split(" ").forEach(g=>{const w=g.endsWith("*");const [a,b]=g.replace("*","").split("-");if(A[a]&&A[b])s+=ln(a,b,w?"fw":"fb")});
  list(p.bar).forEach(g=>{const [a,b]=g.split("=");s+=ln(a,b,"fbar")});
  if(A.H)s+=`<circle class="fh" cx="${S0.H[0]}" cy="${S0.H[1]}" r="6.5">${av("cx",A.H[0],B.H[0])}${av("cy",A.H[1],B.H[1])}</circle>`;
  list(p.g).forEach(g=>{const [type,pt]=g.split("@");if(GLY[type])s+=mv(pt,GLY[type])});
  return `<svg viewBox="4 -8 112 118" class="fig" aria-hidden="true">${s}</svg>`;
}
const figFor=(name,anim)=>{const x=findEx(name);return figure(x?x.pattern:null,anim)};

/* ---------- views ---------- */
const view=document.getElementById("view");
/* ---------- editor draft: kept until saved or cancelled, even across tabs and reloads ---------- */
function saveDraft(){try{if(ui.draft)localStorage.setItem("st_draft",JSON.stringify({d:ui.draft,base:ui.draftBase}));else{localStorage.removeItem("st_draft");ui.draftBase=null}}catch(e){}}
function draftDirty(){return !!ui.draft&&JSON.stringify(ui.draft)!==ui.draftBase;}
function beginDraft(d){ui.draft=d;ui.draftBase=JSON.stringify(d);saveDraft();}
function keepDraftUndo(){if(!ui.draft||!draftDirty())return;const d=ui.draft;const b=ui.draftBase;toast(`Edição de “${d.name.trim()||"treino sem nome"}” descartada`,()=>{ui.draft=d;ui.draftBase=b;saveDraft();ui.view="edit";render();scrollTop();});}
/* ---------- toast with optional undo ---------- */
let toastT=null,toastUndo=null;
function toast(msg,undo){const el=document.getElementById("toast");toastUndo=undo||null;
  el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-a="undo">Desfazer</button>':""}`;
  el.classList.toggle("lift",!!document.querySelector(".restbar.show")||ui.view==="edit");el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(hideToast,undo?6000:2600);}
function hideToast(){clearTimeout(toastT);toastUndo=null;document.getElementById("toast").classList.remove("show");}
function render(){
  if(ui.view==="active"&&!active)ui.view="workouts";
  if(ui.view==="edit"&&!ui.draft)ui.view="workouts";
  ({workouts:vWorkouts,edit:vEdit,active:vActive,history:vHistory,library:vLibrary,settings:vSettings})[ui.view]();
  const h1=view.querySelector("h1");document.getElementById("navTitle").textContent=h1?h1.textContent:"";
  onScroll();renderTabs();renderRest();
}

function vWorkouts(){
  const ws=plans.workouts;let h="";
  if(active)h+=`<div class="live press" data-a="tab" data-v="active" role="button" tabindex="0"><div class="spacer" style="min-width:0"><div class="t">${esc(active.name)}</div><div class="s num">Em andamento · <span data-clock>${hms(Date.now()-active.startedAt)}</span></div></div><span class="btn sm">Continuar</span></div>`;
  if(ui.draft)h+=`<div class="live press draft" data-a="draft-open" role="button" tabindex="0"><div class="spacer" style="min-width:0"><div class="t">${esc(ui.draft.name.trim()||"Treino sem nome")}</div><div class="s">Edição não salva</div></div><span class="btn sm">Continuar editando</span></div>`;
  h+=`<h1>Treinos</h1><p class="sub">Escolha o treino de hoje e toque em Iniciar.</p><div class="stack" style="margin-top:16px">`;
  if(!ws.length){
    if(SB&&!account)h+=`<div class="card empty"><h2>Seu treino está pronto?</h2><p>Se alguém montou o seu treino, entre na sua conta e ele aparece aqui. Se não, monte o seu ou comece por um exemplo.</p><div class="stack" style="gap:8px"><button class="btn primary block" data-a="account">Entrar na minha conta</button><button class="btn block" data-a="new">Montar meu treino</button><button class="btn plain block" data-a="templates">Escolher um modelo de treino</button></div></div>`;
    else h+=`<div class="card empty"><h2>Monte seu primeiro treino</h2><p>Adicione exercícios com séries, repetições, carga e descanso. Se preferir, comece por um modelo conhecido, como ABC, ABCDE ou push, pull, legs, e ajuste do seu jeito.</p><div class="stack" style="gap:8px"><button class="btn primary block" data-a="new">Novo treino</button><button class="btn tinted block" data-a="templates">Escolher um modelo de treino</button></div></div>`;
  }else{
    /* the next workout in the rotation is the one done longest ago (never done counts as oldest) */
    const lastOf=w=>{const s=sessions.find(x=>x.workoutId===w.id);return s?s.startedAt:0};
    const nextId=(!active&&ws.length>1)?ws.filter(w=>w.exercises.length).slice().sort((a,b)=>lastOf(a)-lastOf(b))[0]?.id:null;
    ws.forEach(w=>{
      const totalSets=w.exercises.reduce((a,e)=>a+(+e.sets||0),0);
      const last=sessions.find(s=>s.workoutId===w.id);
      const isLive=active&&active.workoutId===w.id;
      h+=`<div class="card wk"><div><h2>${esc(w.name)}</h2><div class="meta num">${w.id===nextId?'<span class="chip acc">Próximo</span>':""}<span>${w.exercises.length} exercícios</span><span>${totalSets} séries</span><span>${last?"Feito "+ago(last.startedAt):"Ainda não feito"}</span></div></div>
      <p class="ex">${w.exercises.map(e=>esc(e.name)).join(" · ")||"Sem exercícios"}</p>
      <div class="actions"><button class="btn ${(active&&!isLive)||(nextId&&w.id!==nextId)?"tinted":"primary"}" data-a="start" data-v="${w.id}" ${w.exercises.length&&(!active||isLive)?"":"disabled"}>${isLive?"Continuar":"Iniciar"}</button><button class="btn" data-a="edit" data-v="${w.id}">Editar</button></div></div>`;
    });
    h+=`<div class="wkfoot"><button class="btn tinted" data-a="new">Novo treino</button><button class="btn tinted" data-a="templates">Modelos</button></div>`;
    if(active)h+=`<p class="sub" style="text-align:center;font-size:13px">Conclua o treino em andamento para iniciar outro.</p>`;
  }
  view.innerHTML=h+"</div>";
}

function progBlock(e,i){

      :`<button class="target num" data-a="apply-target" data-i="${i}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Subir para ${fmtKg(sg.w)} kg</button>`;}
  else if(sg&&sg.kind==="reps"){const applied=e.sets.every(s=>s.done||s.r>=sg.r);const wl=sg.w>0?" com "+fmtKg(sg.w)+" kg":"";
    t=applied?`<span class="target hint num">Meta de hoje: ${sg.r} reps${wl}</span>`

function exCard(e,i){

function vHistory(){

  sessions.forEach((s,idx)=>{
    const d=new Date(s.startedAt);const {v,n}=volume(s);
    const ups=s.exercises.map(e=>{const m=maxOf(e),p=m==null?null:prevMax(idx,e.name);return p!=null&&m>p?m-p:0});const nUp=ups.filter(x=>x>0).length;
    if(s.id===ui.justFinished){const upl=s.exercises.map((e,k)=>[e,ups[k]]).filter(([,u])=>u>0);
      h=h.replace("<!--recap-->",`<div class="card recap" role="status"><div class="rk">${I.check}</div><h2>Treino salvo</h2><p class="sub num">${esc(s.name)} · ${hms((s.endedAt||s.startedAt)-s.startedAt)} · ${n} séries</p>${s.kcal?`<div class="ev num" style="margin-top:10px">${s.kcal.total.toLocaleString("pt-BR")} <span>kcal estimadas</span></div>`:""}${upl.length?`<ul class="changes">${upl.map(([e,u])=>`<li><span>${esc(e.name)}</span><span class="delta" style="margin:0">+${fmtKg(u)} kg</span></li>`).join("")}</ul>`:`<p class="rnote">${idx===sessions.length-1?"Primeiro treino registrado. Da próxima vez o app mostra estas cargas e sugere quando subir.":"Cargas mantidas. Da próxima vez o app mostra a meta de cada exercício."}</p>`}</div>`);}

    <div class="body"><table>${s.exercises.map((e,k)=>[e,ups[k]]).filter(([e])=>e.sets.some(t=>t.done)).map(([e,up])=>`<tr><td>${esc(e.name)}${up>0?`<span class="delta">+${fmtKg(up)} kg</span>`:""}</td><td class="num">${fmtSets(e.sets.filter(t=>t.done))}</td></tr>`).join("")||(s.cardio?"":'<tr><td>Nenhuma série marcada</td><td></td></tr>')}${s.cardio?`<tr><td>Cardio · ${esc((CARDIO_BY[s.cardio.type]||CARDIO_BY.outro).label)}</td><td class="num">${Math.max(1,Math.round(s.cardio.sec/60))} min</td></tr>`:""}${s.kcal?`<tr><td>Gasto estimado<small class="tsub">musculação ${s.kcal.lift} · cardio ${s.kcal.cardio}</small></td><td class="num">${s.kcal.total.toLocaleString("pt-BR")} kcal</td></tr>`:""}</table>
    <div style="margin-top:12px">${holdBtn("del-s",s.id,"Segure para apagar","block")}</div></div></details>`;
  });

/* ---------- workout session ---------- */
function startWorkout(wid){
  if(active){ui.view="active";render();scrollTop();return}
  const w=plans.workouts.find(x=>x.id===wid);if(!w)return;
  active={id:uid(),workoutId:w.id,name:w.name,startedAt:Date.now(),rest:null,
    exercises:w.exercises.map(e=>{const last=lastFor(e.name);const n=Math.max(1,+e.sets||1);const sets=[];
      for(let k=0;k<n;k++){const ls=last&&last.sets[Math.min(k,last.sets.length-1)];
        sets.push({w:ls?ls.w:(+e.weight||0),r:ls?ls.r:firstInt(e.reps),done:false});}
      return {name:e.name,planName:e.name,reps:e.reps,rest:+e.rest||90,notes:e.notes||"",last:last?{when:last.when,sets:last.sets.map(s=>({w:s.w,r:s.r}))}:null,sets};})};
  ui.view="active";saveActive();keepAwake();render();scrollTop();
}
function finishWorkout(){
  const a=active;a.endedAt=Date.now();
  if(a.cardio&&a.cardio.since){a.cardio.ms+=a.endedAt-a.cardio.since;a.cardio.since=null;}
  const cm=cardioMs(a.cardio);const en=energy(a.endedAt-a.startedAt,a.cardio,settings.weight);
  const rec={id:a.id,workoutId:a.workoutId,name:a.name,startedAt:a.startedAt,endedAt:a.endedAt,
    exercises:a.exercises.map(e=>({name:e.name,sets:e.sets.map(s=>({w:s.w,r:s.r,done:s.done}))}))};
  if(cm>=30000)rec.cardio={type:a.cardio.type,sec:Math.round(cm/1000)};
  if(en)rec.kcal={lift:en.lift,cardio:cm>=30000?en.cardio:0,total:en.total,w:en.w};
  sessions.unshift(rec);saveSessions();pushSession(rec);
  const w=plans.workouts.find(x=>x.id===a.workoutId);
  if(w&&ui.updatePlan){let changed=false;
    a.exercises.forEach(e=>{const pe=w.exercises.find(x=>x.name.trim().toLowerCase()===e.name.trim().toLowerCase());
      const ds=e.sets.filter(s=>s.done);if(pe&&ds.length){const mx=Math.max(...ds.map(s=>s.w));if(mx!==+pe.weight){pe.weight=mx;changed=true}}});
    if(changed)savePlans();}
  ui.justFinished=rec.id;active=null;closeSheet();saveActive();haptic([20,60,20]);ui.view="history";render();scrollTop();
}

/* ---------- rest timer ---------- */
function startRest(sec,exName){const an=document.getElementById("restAnnounce");if(an)an.textContent="";active.rest={endAt:Date.now()+sec*1000,total:sec,ex:exName,beeped:false};saveActive();renderRest();}
function renderRest(){
  const bar=document.getElementById("restbar");
  const show=!!(active&&active.rest&&ui.view!=="edit");
  bar.classList.toggle("show",show);
  if(!show)return;
  const r=active.rest;const left=(r.endAt-Date.now())/1000;
  document.getElementById("restEx").textContent=r.ex;
  if(left>0){bar.classList.remove("over");document.getElementById("restLabel").textContent="Descanso";
    document.getElementById("restTime").textContent=mmss(Math.ceil(left));
    document.getElementById("restProg").style.transform=`scaleX(${Math.max(0,Math.min(1,1-left/r.total))})`;}
  else{
    if(!r.beeped){r.beeped=true;LS.set("st_active",active);bar.classList.add("over");const an=document.getElementById("restAnnounce");if(an)an.textContent="Descanso encerrado. Próxima série.";beep();haptic([250,120,250]);} /* visual + sound + haptic on the same frame */
    bar.classList.add("over");document.getElementById("restLabel").textContent="Próxima série";
    document.getElementById("restTime").textContent="+"+mmss(-left);document.getElementById("restProg").style.transform="scaleX(1)";}

let actx=null;
function ensureAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){if(!actx||!settings.sound)return;try{const t0=actx.currentTime;[0,.22,.44].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=i===2?1318.5:987.8;
  g.gain.setValueAtTime(.0001,t0+t);g.gain.exponentialRampToValueAtTime(.35,t0+t+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+t+(i===2?.45:.18));o.connect(g);g.connect(actx.destination);o.start(t0+t);o.stop(t0+t+.5);});}catch(e){}}
let lock=null;
async function keepAwake(){try{if(settings.awake&&active&&navigator.wakeLock&&document.visibilityState==="visible"&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null})}}catch(e){lock=null}}

/* ---------- drag to dismiss (rest pill + sheet) ---------- */
function rubber(over,dim){const c=.55;return (over*dim*c)/(dim+c*over);}
function draggable(el,onDismiss,handle){
  let s=null;
  el.addEventListener("pointerdown",e=>{if(e.target.closest("button,input,label"))return;if(handle&&!e.target.closest(handle))return;if(s)return; /* ignore extra fingers */
    s={y:e.clientY,t:performance.now(),dy:0,hist:[[e.clientY,performance.now()]]};el.setPointerCapture(e.pointerId);el.style.transition="none";});
  el.addEventListener("pointermove",e=>{if(!s)return;let dy=e.clientY-s.y;if(dy<0)dy=-rubber(-dy,el.offsetHeight);s.dy=dy;
    s.hist.push([e.clientY,performance.now()]);if(s.hist.length>5)s.hist.shift();el.style.transform=`translateY(${dy}px)`;});
  const end=()=>{if(!s)return;const h=s.hist,a=h[0],b=h[h.length-1];const v=(b[1]-a[1])>0?(b[0]-a[0])/(b[1]-a[1]):0; /* px/ms */
    const dismiss=s.dy>Math.min(90,el.offsetHeight*.4)||(v>.11&&s.dy>8);s=null;el.style.transition="";
    if(dismiss){haptic(8);onDismiss();setTimeout(()=>{el.style.transition="none";el.style.transform="";void el.offsetHeight;el.style.transition=""},450);}
    else el.style.transform="";};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}
draggable(document.getElementById("restIn"),()=>{if(active){active.rest=null;saveActive();}renderRest();});
draggable(document.getElementById("sheetIn"),closeSheet,".sheet-head");

function doStep(b){
  const i=+b.dataset.i,j=+b.dataset.j,d=parseNum(b.dataset.v);const e=active&&active.exercises[i];if(!e)return;const s=e.sets[j];
  if(b.dataset.step==="w"){s.w=Math.max(0,Math.round((s.w+d)*100)/100);
    for(let k=j;k<e.sets.length;k++){const n=e.sets[k];if(k===j||!n.done){n.w=s.w;const inp=document.getElementById(`w-${i}-${k}`);if(inp&&document.activeElement!==inp)inp.value=fmtKg(n.w);markUp(i,k);}}}
  else{s.r=Math.max(0,s.r+d);const inp=document.getElementById(`r-${i}-${j}`);if(inp)inp.value=s.r;}
  saveActive();
}
let rep=null;
function stopRep(){if(rep){clearTimeout(rep.t);clearInterval(rep.iv);rep=null}}
document.addEventListener("pointerdown",e=>{

  if(h){h.classList.add("holding");clearTimeout(holdT);holdT=setTimeout(()=>{h.classList.remove("holding");haptic(30);doHold(h.dataset.hold,h.dataset.v)},900);}

  else if(f==="libq"){libQ=t.value;renderLibList();}
  else if(f==="sw"){const e=active.exercises[i];const w=Math.max(0,parseNum(t.value));
    for(let k=j;k<e.sets.length;k++){const n=e.sets[k];if(k===j||!n.done){n.w=w;if(k!==j){const inp=document.getElementById(`w-${i}-${k}`);if(inp)inp.value=fmtKg(w);}markUp(i,k);}}
    saveActive();}
  else if(f==="sr"){active.exercises[i].sets[j].r=Math.max(0,Math.round(parseNum(t.value)));saveActive();}
});
document.addEventListener("change",ev=>{if(ev.target.dataset.f==="setting"){settings[ev.target.dataset.k]=ev.target.checked;saveSettings();if(ev.target.dataset.k==="awake"&&!ev.target.checked&&lock){try{lock.release()}catch(e){}}return}
  if(ev.target.dataset.f==="cardiotype"&&active&&active.cardio){active.cardio.type=ev.target.value;settings.lastCardio=ev.target.value;saveSettings();saveActive();rerenderCardio();return}
  if(ev.target.dataset.f==="updplan")ui.updatePlan=ev.target.checked;if(ev.target.dataset.f==="swappersist")ui.swapPersist=ev.target.checked;});
/* select the whole value on focus, so typing replaces it; the click that focused it would otherwise drop the selection */
let freshFocus=null;
document.addEventListener("focusin",ev=>{if(ev.target.matches(".step input")){freshFocus=ev.target;setTimeout(()=>{try{ev.target.select()}catch(e){}},0)}});
document.addEventListener("mouseup",ev=>{if(freshFocus&&ev.target===freshFocus){ev.preventDefault();try{freshFocus.select()}catch(e){}}freshFocus=null});
document.addEventListener("focusout",ev=>{if(ev.target.matches('.step input[data-f="sw"]'))ev.target.value=fmtKg(parseNum(ev.target.value)||0)});

/* nav bar material appears only once content is under it */
const top=document.getElementById("top");
function onScroll(){top.classList.toggle("scrolled",window.scrollY>40);}
window.addEventListener("scroll",onScroll,{passive:true});

/* ---------- account ---------- */
function openAccount(msg,err){
  sheetStack=[];
  if(!SB){showSheet(`<div class="acct"><h2 id="sheetTitle" style="font-size:22px">Seus dados</h2><p class="sub">Os treinos estão salvos só neste aparelho. A sincronização ainda não foi configurada.</p><button class="btn block" data-a="sheet-close">Ok</button></div>`,false);return}
  if(account){
    showSheet(`<div class="acct"><h2 id="sheetTitle" style="font-size:22px">Sua conta</h2><p class="sub">${esc(account.email||"")}</p>
    <p class="msg">Seus treinos sincronizam entre todos os aparelhos em que você entrar.</p>
    <div class="stack" style="gap:8px"><button class="btn block" data-a="acct-sync">Sincronizar agora</button><button class="btn plain block" data-a="sheet-close">Fechar</button></div></div>`,false);
    return;
  }
  showSheet(`<div class="acct"><h2 id="sheetTitle" style="font-size:22px">Entrar</h2><p class="sub">Entre para salvar seus treinos na nuvem e usar em qualquer aparelho. Cada pessoa vê só os próprios dados.</p>
  <form id="acctForm" autocomplete="on" onsubmit="return false">
  <input class="namein" id="acEmail" type="email" inputmode="email" autocomplete="username" placeholder="E-mail" aria-label="E-mail" autocapitalize="off">
  <input class="namein" id="acPass" type="password" autocomplete="current-password" placeholder="Senha (mín. 6 caracteres)" aria-label="Senha">
  <p class="msg ${err?"err":""}" id="acMsg" role="status">${esc(msg||"")}</p>
  <div class="stack" style="gap:8px"><button class="btn primary block" data-a="acct-login">Entrar</button><button class="btn block" data-a="acct-signup">Criar conta</button><button class="btn plain block" data-a="acct-reset">Esqueci a senha</button></div></form></div>`,false);
  setTimeout(()=>{const e=document.getElementById("acEmail");e&&e.focus()},350);
}
function acctMsg(t,err){const m=document.getElementById("acMsg");if(m){m.textContent=t;m.classList.toggle("err",!!err)}}
const AUTH_ERR={"Invalid login credentials":"E-mail ou senha incorretos.","Email not confirmed":"Confirme seu e-mail pelo link que enviamos e tente de novo.","User already registered":"Esse e-mail já tem conta. Toque em Entrar."};
async function acctDo(kind){
  const email=(document.getElementById("acEmail")||{}).value||"",pass=(document.getElementById("acPass")||{}).value||"";
  if(!email.includes("@")){acctMsg("Digite seu e-mail.",true);return}
  if(kind!=="reset"&&pass.length<6){acctMsg("A senha precisa ter pelo menos 6 caracteres.",true);return}
  if(!navigator.onLine){acctMsg("Sem internet agora. Tente quando estiver conectado.",true);return}
  acctMsg("Aguarde…");
  try{
    let res;
    if(kind==="login")res=await SB.auth.signInWithPassword({email,password:pass});
    else if(kind==="signup")res=await SB.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
    else res=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(res.error)throw res.error;
    if(kind==="reset"){acctMsg("Enviamos um link para redefinir a senha.");return}
    if(kind==="signup"&&!res.data.session){acctMsg("Conta criada. Abra o link que enviamos para o seu e-mail e depois toque em Entrar.");return}
    closeSheet();await initSync();render();
  }catch(e){acctMsg(AUTH_ERR[e.message]||("Não deu certo: "+e.message),true)}
}
async function acctLogout(){
  try{await SB.auth.signOut()}catch(e){}
  wipeLocal();location.reload();
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  switch(b.dataset.a){
    case "account": openAccount();break;
    case "settings": if(ui.view==="settings"){window.scrollTo({top:0,behavior:"smooth"});break}ui.prev=ui.view;ui.view="settings";render();scrollTop();break;
    case "set-opt":{const k=b.dataset.k;let v=b.dataset.v;if(k!=="theme")v=parseFloat(v);settings[k]=v;saveSettings();if(k==="theme")applyTheme();
      b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));break;}
    case "pw-save": savePassword();break;
    case "export": exportData();break;
    case "acct-login": acctDo("login");break;
    case "acct-signup": acctDo("signup");break;
    case "acct-reset": acctDo("reset");break;
    case "acct-sync": closeSheet();initSync().then(()=>render());break;
  }
});
if(SB)SB.auth.onAuthStateChange((evt)=>{
  if(evt==="PASSWORD_RECOVERY"){ui.recovery=true;initSync().then(()=>{ui.view="settings";render();scrollTop();});}
});
window.addEventListener("online",()=>{if(SB)initSync().then(()=>render())});

render();
if(active)keepAwake();
initSync();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js");</script>
</body>
